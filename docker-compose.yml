services:
  db:
    image: postgres:16
    container_name: taskstracker_db
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: taskstracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d taskstracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: