services:
  db:
    image: postgres:16
    container_name: taskstracker_db
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: taskstracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d taskstracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  db_test:
    image: postgres:16
    container_name: taskstracker_db_test
    profiles: ["test"] 
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: taskstracker_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data


volumes:
  pgdata: